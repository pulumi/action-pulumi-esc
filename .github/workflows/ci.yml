permissions: write-all # Equivalent to default permissions plus id-token: write
name: Continuous Integration

on:
  pull_request: null
  push:
    branches:
      - main
      - 'releases/*'

env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: imports/github-secrets
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: PULUMI_ACCESS_TOKEN

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v1
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@v1
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Plaintext ESC Action
        id: plaintext
        uses: ./
        with:
          access-token: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
          organization: lbrlabs
          environment: action-unit-test
          keys: '$.properties.environmentVariables.value.EXAMPLE_SETTING.value'
          secret: false
      - name: Use the plaintext output
        run: |
          echo "The extracted values are: ${{ steps.plaintext.outputs.result }}"
      - name: Secret ESC Action
        id: secret
        uses: ./
        with:
          access-token: ${{ steps.esc-secrets.outputs.PULUMI_ACCESS_TOKEN }}
          organization: lbrlabs
          environment: action-unit-test
          keys: '$.properties.environmentVariables.value.EXAMPLE_SETTING.value'
          secret: true
      - name: Use the output
        run: |
          echo "The extracted values are: ${{ steps.secret.outputs.result }}"
